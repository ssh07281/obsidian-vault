<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옵시디언 링크</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #c8f07a;
    --accent-dim: #8aab3f;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-dimmer: #444;
    --danger: #ff6b6b;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--accent);
  }
  .version-badge {
    font-size: 10px;
    color: var(--text-dimmer);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 99px;
  }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .badge {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .badge.ok { border-color: var(--accent-dim); color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr 300px;
    flex: 1;
    height: calc(100vh - 65px);
  }

  /* ── 사이드바 ── */
  .sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header span { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .note-count { color: var(--accent); font-size: 11px; }

  .upload-area {
    margin: 8px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.8;
    position: relative;
    overflow: hidden;
  }
  .upload-area:hover, .upload-area.drag { border-color: var(--accent); color: var(--accent); background: #1e2e0a22; }
  .upload-area.loading { pointer-events: none; border-color: var(--accent-dim); }

  /* 업로드 로딩 오버레이 */
  .upload-loading-overlay {
    position: absolute; inset: 0;
    background: #0e0e0ecc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    color: var(--accent);
    backdrop-filter: blur(2px);
  }
  .upload-loading-overlay .upload-progress-bar {
    width: 80%;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .upload-loading-overlay .upload-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.2s;
  }

  #fileInput { display: none; }

  .note-list {
    overflow-y: auto;
    flex: 1;
    padding: 4px 6px;
  }
  .note-list::-webkit-scrollbar { width: 4px; }
  .note-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tree-folder { margin-bottom: 2px; }
  .tree-folder-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    user-select: none;
    transition: background 0.15s;
  }
  .tree-folder-label:hover { background: var(--surface); color: var(--text); }
  .tree-folder-label .arrow { font-size: 9px; transition: transform 0.2s; }
  .tree-folder-label.open .arrow { transform: rotate(90deg); }
  .tree-children { padding-left: 14px; border-left: 1px solid var(--border); margin-left: 10px; }
  .tree-children.hidden { display: none; }

  .note-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    font-size: 12px;
  }
  .note-item:hover { background: var(--surface); }
  .note-item.active { background: #1e2e0a; border: 1px solid var(--accent-dim); }
  .note-item .note-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dimmer); flex-shrink: 0; }
  .note-item.embedded .note-dot { background: var(--accent); }

  /* ── 메인 ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .main-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .main-header .note-title {
    font-family: 'Instrument Serif', serif;
    font-size: 17px;
    font-weight: 400;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note-path-label { font-size: 10px; color: var(--text-dimmer); padding: 8px 20px 0; }

  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0e0e0e; font-weight: 500; }
  .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .note-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    line-height: 1.75;
    color: var(--text-dim);
    font-size: 13px;
    white-space: pre-wrap;
  }
  .note-content::-webkit-scrollbar { width: 4px; }
  .note-content::-webkit-scrollbar-thumb { background: var(--border); }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dimmer);
    gap: 8px;
    text-align: center;
    padding: 40px;
    line-height: 1.8;
  }
  .empty-state .big { font-family: 'Instrument Serif', serif; font-size: 32px; color: var(--text-dim); }

  /* ── 추천 패널 ── */
  .panel { display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .panel-content { flex: 1; overflow-y: auto; padding: 12px; }
  .panel-content::-webkit-scrollbar { width: 4px; }
  .panel-content::-webkit-scrollbar-thumb { background: var(--border); }

  .rec-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 0.15s;
  }
  .rec-item:hover { border-color: var(--accent-dim); }
  .rec-name { color: var(--accent); font-size: 13px; margin-bottom: 2px; }
  .rec-folder { color: var(--text-dimmer); font-size: 10px; margin-bottom: 6px; }
  .rec-score { color: var(--text-dimmer); font-size: 11px; margin-bottom: 8px; }
  .score-bar { height: 2px; background: var(--border); border-radius: 1px; margin-bottom: 10px; overflow: hidden; }
  .score-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 0.4s ease; }
  .copy-link {
    font-size: 11px; color: var(--text-dim); cursor: pointer;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
    display: inline-block; transition: all 0.15s; user-select: none;
  }
  .copy-link:hover { border-color: var(--accent); color: var(--accent); }
  .copy-link.copied { color: var(--accent); border-color: var(--accent); }

  .copy-all-wrap { padding: 12px; border-top: 1px solid var(--border); }

  /* ── 모달 ── */
  .modal-bg {
    position: fixed; inset: 0;
    background: #0009;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 440px;
    max-width: 90vw;
  }
  .modal h2 { font-family: 'Instrument Serif', serif; font-size: 20px; font-weight: 400; margin-bottom: 6px; }
  .modal p { color: var(--text-dim); font-size: 12px; margin-bottom: 20px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: var(--radius);
    font-family: 'DM Mono', monospace; font-size: 12px; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── 토스트 ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 18px; border-radius: 99px;
    font-size: 12px; transition: transform 0.3s ease;
    pointer-events: none; z-index: 200; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  .spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-wrap { padding: 10px 16px; border-top: 1px solid var(--border); }
  .progress-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .progress-bar { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
</style>
</head>
<body>

<header>
  <h1>옵시디언 링크</h1>
  <span class="version-badge">V1.01</span>
  <div class="header-right">
    <span class="badge" id="vaultBadge">설정 필요</span>
    <button class="btn" onclick="openSettings()">설정</button>
  </div>
</header>

<div class="layout">

  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>노트</span>
      <span class="note-count" id="noteCount">0개</span>
    </div>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div>📂</div>
      <div>.md 파일 또는 폴더를 드래그해 주세요</div>
      <div style="color:var(--text-dimmer);font-size:10px">클릭하면 폴더 선택창이 열립니다</div>
      <!-- 업로드 로딩 오버레이 -->
      <div class="upload-loading-overlay" id="uploadOverlay" style="display:none">
        <span class="spinner" style="width:14px;height:14px;margin:0"></span>
        <span id="uploadOverlayLabel">업로드 중...</span>
        <div class="upload-progress-bar">
          <div class="upload-progress-fill" id="uploadProgressFill" style="width:0%"></div>
        </div>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".md" multiple webkitdirectory>
    <div class="note-list" id="noteList"></div>
  </div>

  <!-- 메인 -->
  <div class="main">
    <div id="mainHeader" class="main-header" style="display:none">
      <span class="note-title" id="currentNoteTitle"></span>
      <button class="btn" id="deleteBtn" onclick="deleteCurrentNote()" style="color:var(--danger);border-color:var(--danger)">삭제</button>
      <button class="btn primary" id="analyzeBtn" onclick="analyzeNote()">🔗 링크 추천</button>
    </div>
    <div id="emptyState" class="empty-state">
      <div class="big">∅</div>
      <div>.md 파일을 업로드하시면<br>AI가 관련 노트를 찾아드립니다</div>
    </div>
    <div id="notePathLabel" class="note-path-label" style="display:none"></div>
    <div id="noteContent" class="note-content" style="display:none"></div>
    <div id="progressWrap" class="progress-wrap" style="display:none">
      <div class="progress-label" id="progressLabel">분석 중...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- 추천 패널 -->
  <div class="panel">
    <div class="panel-header">관련 노트 추천</div>
    <div class="panel-content" id="recList">
      <div style="color:var(--text-dimmer);padding:20px 0;text-align:center;line-height:2">
        노트를 선택하고<br>링크 추천 버튼을 눌러 주세요
      </div>
    </div>
    <div class="copy-all-wrap" id="copyAllWrap" style="display:none">
      <button class="btn" style="width:100%" onclick="copyAll()">전체 복사</button>
    </div>
  </div>

</div>

<!-- 설정 모달 -->
<div class="modal-bg" id="settingsModal" style="display:none">
  <div class="modal">
    <h2>설정</h2>
    <p>API 키는 브라우저 로컬스토리지에만 저장됩니다. 외부로 전송되지 않습니다.</p>
    <div class="field">
      <label>Voyage AI API Key</label>
      <input type="password" id="voyageKey" placeholder="pa-xxxxxxxxxxxxxxxx">
    </div>
    <div class="field">
      <label>GitHub Token</label>
      <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxx">
    </div>
    <div class="field">
      <label>GitHub 사용자명</label>
      <input type="text" id="githubUser" placeholder="your-username">
    </div>
    <div class="field">
      <label>GitHub 저장소 이름</label>
      <input type="text" id="githubRepo" placeholder="obsidian-vault">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">취소</button>
      <button class="btn primary" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const VERSION = 'V1.01';

const STATE = {
  notes: {},
  currentStem: null,
  settings: {},
  analyzing: false,
  _embeddingsSha: null,
  _folderOpen: {},
  _stemIndex: [],
};

// ── 초기화 ────────────────────────────────────────────────────
async function init() {
  loadSettings();
  if (STATE.settings.githubToken) {
    await loadFromGitHub();
  } else {
    setTimeout(openSettings, 400);
  }
  renderNoteList();
  updateBadge();
}

// ── 설정 ──────────────────────────────────────────────────────
function loadSettings() {
  const s = localStorage.getItem('nlr_settings');
  if (s) STATE.settings = JSON.parse(s);
  if (STATE.settings.voyageKey) document.getElementById('voyageKey').value = STATE.settings.voyageKey;
  if (STATE.settings.githubToken) document.getElementById('githubToken').value = STATE.settings.githubToken;
  if (STATE.settings.githubUser) document.getElementById('githubUser').value = STATE.settings.githubUser;
  if (STATE.settings.githubRepo) document.getElementById('githubRepo').value = STATE.settings.githubRepo;
}

function saveSettings() {
  STATE.settings = {
    voyageKey: document.getElementById('voyageKey').value.trim(),
    githubToken: document.getElementById('githubToken').value.trim(),
    githubUser: document.getElementById('githubUser').value.trim(),
    githubRepo: document.getElementById('githubRepo').value.trim(),
  };
  localStorage.setItem('nlr_settings', JSON.stringify(STATE.settings));
  closeSettings();
  updateBadge();
  toast('설정이 저장되었습니다');
  loadFromGitHub();
}

function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

function updateBadge() {
  const badge = document.getElementById('vaultBadge');
  const s = STATE.settings;
  if (s.voyageKey && s.githubToken && s.githubUser && s.githubRepo) {
    badge.textContent = `${s.githubUser}/${s.githubRepo}`;
    badge.className = 'badge ok';
  } else {
    badge.textContent = '설정 필요';
    badge.className = 'badge';
  }
}

// ── GitHub API ────────────────────────────────────────────────
function ghHeaders() {
  return {
    'Authorization': `token ${STATE.settings.githubToken}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
}
function ghBase() {
  const { githubUser: u, githubRepo: r } = STATE.settings;
  return `https://api.github.com/repos/${u}/${r}/contents`;
}

async function ghGetAllFiles(path = 'notes') {
  const res = await fetch(`${ghBase()}/${path}`, { headers: ghHeaders() });
  if (!res.ok) return [];
  const items = await res.json();
  let files = [];
  for (const item of items) {
    if (item.type === 'file' && item.name.endsWith('.md')) {
      files.push(item);
    } else if (item.type === 'dir') {
      const sub = await ghGetAllFiles(item.path);
      files = files.concat(sub);
    }
  }
  return files;
}

async function loadFromGitHub() {
  const s = STATE.settings;
  if (!s.githubToken || !s.githubUser || !s.githubRepo) return;
  try {
    let embCache = {};
    const embRes = await fetch(`${ghBase()}/embeddings.json`, { headers: ghHeaders() });
    if (embRes.ok) {
      const embFile = await embRes.json();
      embCache = JSON.parse(atob(embFile.content.replace(/\n/g, '')));
      STATE._embeddingsSha = embFile.sha;
    }

    const files = await ghGetAllFiles('notes');
    for (const file of files) {
      const relativePath = file.path.replace(/^notes\//, '');
      const parts = relativePath.split('/');
      const fileName = parts[parts.length - 1];
      const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
      const stem = relativePath.replace(/\.md$/, '');

      const contentRes = await fetch(file.download_url);
      const content = await contentRes.text();

      STATE.notes[stem] = {
        name: fileName,
        path: relativePath,
        folder,
        content,
        embedding: embCache[stem] || null,
        githubSha: file.sha,
      };
    }
    renderNoteList();
    if (files.length > 0) toast(`GitHub에서 노트 ${files.length}개를 불러왔습니다`);
  } catch(e) {
    console.error('GitHub 로드 오류:', e);
  }
}

async function saveNoteToGitHub(stem) {
  const note = STATE.notes[stem];
  const path = `notes/${note.path}`;
  const body = {
    message: `노트 저장: ${note.name}`,
    content: btoa(unescape(encodeURIComponent(note.content))),
  };
  if (note.githubSha) body.sha = note.githubSha;
  const res = await fetch(`${ghBase()}/${path}`, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body),
  });
  if (res.ok) {
    const data = await res.json();
    STATE.notes[stem].githubSha = data.content.sha;
  }
}

async function deleteNoteFromGitHub(stem) {
  const note = STATE.notes[stem];
  if (!note.githubSha) return;
  await fetch(`${ghBase()}/notes/${note.path}`, {
    method: 'DELETE',
    headers: ghHeaders(),
    body: JSON.stringify({ message: `노트 삭제: ${note.name}`, sha: note.githubSha }),
  });
}

async function saveEmbeddingsToGitHub() {
  const embData = {};
  for (const [stem, note] of Object.entries(STATE.notes)) {
    if (note.embedding) embData[stem] = note.embedding;
  }
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(embData))));
  const body = { message: '임베딩 캐시 업데이트', content };
  if (STATE._embeddingsSha) body.sha = STATE._embeddingsSha;
  const res = await fetch(`${ghBase()}/embeddings.json`, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body),
  });
  if (res.ok) {
    const data = await res.json();
    STATE._embeddingsSha = data.content.sha;
  }
}

// ── 업로드 로딩 표시 ──────────────────────────────────────────
function showUploadLoading(label, pct) {
  const overlay = document.getElementById('uploadOverlay');
  overlay.style.display = 'flex';
  document.getElementById('uploadOverlayLabel').textContent = label;
  document.getElementById('uploadProgressFill').style.width = pct + '%';
  document.getElementById('uploadArea').classList.add('loading');
}
function hideUploadLoading() {
  document.getElementById('uploadOverlay').style.display = 'none';
  document.getElementById('uploadArea').classList.remove('loading');
}

// ── 파일 업로드 ───────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', handleFiles);

const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag');
  handleFiles({ target: { files: e.dataTransfer.files } });
});

async function handleFiles(e) {
  const files = [...e.target.files].filter(f => f.name.endsWith('.md'));
  if (!files.length) return;

  showUploadLoading(`0 / ${files.length}개 업로드 중...`, 0);

  let added = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const pct = Math.round((i / files.length) * 100);
    showUploadLoading(`${i + 1} / ${files.length}개 업로드 중...`, pct);

    // webkitRelativePath: "선택한폴더/서브폴더/파일.md"
    // 선택한 폴더 자체를 포함해서 경로 유지 (최상위 1단계 제거 안 함)
    const relativePath = file.webkitRelativePath || file.name;
    const parts = relativePath.split('/');
    // 브라우저가 폴더 선택 시 최상위에 폴더명 붙임 → 그대로 유지
    const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
    const stem = relativePath.replace(/\.md$/, '');

    const content = await file.text();
    STATE.notes[stem] = {
      name: file.name,
      path: relativePath,
      folder,
      content,
      embedding: STATE.notes[stem]?.embedding || null,
      githubSha: STATE.notes[stem]?.githubSha || null,
    };
    added++;

    if (STATE.settings.githubToken) {
      await saveNoteToGitHub(stem);
    }
  }

  hideUploadLoading();
  renderNoteList();
  toast(`노트 ${added}개가 추가되었습니다`);
  document.getElementById('fileInput').value = '';
}

// ── 폴더 트리 ────────────────────────────────────────────────
function buildTree(notes) {
  const tree = {};
  for (const stem of Object.keys(notes)) {
    const folder = notes[stem].folder || '';
    if (!tree[folder]) tree[folder] = [];
    tree[folder].push(stem);
  }
  return tree;
}

function renderNoteList() {
  const list = document.getElementById('noteList');
  const stems = Object.keys(STATE.notes);
  document.getElementById('noteCount').textContent = `${stems.length}개`;
  STATE._stemIndex = stems;

  if (!stems.length) { list.innerHTML = ''; return; }

  const tree = buildTree(STATE.notes);
  let html = '';

  const rootNotes = (tree[''] || []).sort();
  for (const stem of rootNotes) {
    html += renderNoteItem(stem, stems.indexOf(stem));
  }

  const folders = Object.keys(tree).filter(f => f !== '').sort();
  for (const folder of folders) {
    const isOpen = STATE._folderOpen[folder] !== false;
    const folderId = 'folder-' + folder.replace(/[^a-zA-Z0-9]/g, '-');
    html += `
      <div class="tree-folder">
        <div class="tree-folder-label ${isOpen ? 'open' : ''}" onclick="toggleFolder(${JSON.stringify(folder)})">
          <span class="arrow">▶</span>
          <span>📁 ${folder}</span>
          <span style="color:var(--text-dimmer);margin-left:auto">${tree[folder].length}</span>
        </div>
        <div class="tree-children ${isOpen ? '' : 'hidden'}" id="${folderId}">
          ${tree[folder].sort().map(stem => renderNoteItem(stem, stems.indexOf(stem))).join('')}
        </div>
      </div>`;
  }

  list.innerHTML = html;
}

function renderNoteItem(stem, idx) {
  const note = STATE.notes[stem];
  const active = stem === STATE.currentStem ? ' active' : '';
  const embedded = note.embedding ? ' embedded' : '';
  const displayName = note.name.replace(/\.md$/, '');
  return `<div class="note-item${active}${embedded}" onclick="selectNoteByIndex(${idx})">
    <div class="note-dot"></div>
    <div class="note-name" title="${note.path}">${displayName}</div>
  </div>`;
}

function toggleFolder(folder) {
  const isNowOpen = STATE._folderOpen[folder] === false ? true : false;
  STATE._folderOpen[folder] = isNowOpen;
  const folderId = 'folder-' + folder.replace(/[^a-zA-Z0-9]/g, '-');
  const children = document.getElementById(folderId);
  const label = children && children.previousElementSibling;
  if (children) children.classList.toggle('hidden', !isNowOpen);
  if (label) label.classList.toggle('open', isNowOpen);
}

// ── 노트 선택 ─────────────────────────────────────────────────
function selectNoteByIndex(idx) {
  const stem = STATE._stemIndex && STATE._stemIndex[idx];
  if (!stem) return;
  selectNote(stem);
}

function selectNote(stem) {
  STATE.currentStem = stem;
  const note = STATE.notes[stem];
  if (!note) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('noteContent').style.display = 'block';
  document.getElementById('currentNoteTitle').textContent = note.name.replace(/\.md$/, '');

  const pathLabel = document.getElementById('notePathLabel');
  if (note.folder) {
    pathLabel.style.display = 'block';
    pathLabel.textContent = note.folder;
  } else {
    pathLabel.style.display = 'none';
  }

  document.getElementById('noteContent').textContent = note.content;
  document.getElementById('recList').innerHTML = `<div style="color:var(--text-dimmer);padding:20px 0;text-align:center">링크 추천 버튼을 눌러 주세요</div>`;
  document.getElementById('copyAllWrap').style.display = 'none';

  renderNoteList();
}

// ── 노트 삭제 ─────────────────────────────────────────────────
async function deleteCurrentNote() {
  if (!STATE.currentStem) return;
  const stem = STATE.currentStem;
  if (!confirm(`"${STATE.notes[stem].name}" 노트를 삭제하시겠습니까?`)) return;

  if (STATE.settings.githubToken) await deleteNoteFromGitHub(stem);
  delete STATE.notes[stem];
  STATE.currentStem = null;

  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('noteContent').style.display = 'none';
  document.getElementById('notePathLabel').style.display = 'none';
  document.getElementById('recList').innerHTML = '';
  document.getElementById('copyAllWrap').style.display = 'none';

  renderNoteList();
  toast('노트가 삭제되었습니다');
}

// ── Voyage AI 임베딩 ──────────────────────────────────────────
function cleanText(text) {
  return text
    .replace(/^---.*?---\s*/s, '')
    .replace(/```.*?```/gs, ' ')
    .replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g, '$1')
    .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
    .replace(/[#*>`_~]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 4000);
}

async function getEmbeddingWithRetry(text, retries = 3) {
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const res = await fetch('https://api.voyageai.com/v1/embeddings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${STATE.settings.voyageKey}`,
        },
        body: JSON.stringify({ input: [cleanText(text)], model: 'voyage-3-lite', input_type: 'document' }),
      });

      if (res.status === 429) {
        const wait = (attempt + 1) * 3000;
        updateProgress(-1, -1, `API 요청 한도 초과 — ${wait/1000}초 후 재시도합니다...`);
        await new Promise(r => setTimeout(r, wait));
        continue;
      }

      if (!res.ok) throw new Error(`Voyage API 오류: ${res.status}`);
      const data = await res.json();
      return data.data[0].embedding;
    } catch(e) {
      if (attempt === retries - 1) throw e;
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

function cosineSim(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

// ── 링크 추천 ─────────────────────────────────────────────────
async function analyzeNote() {
  if (!STATE.currentStem || STATE.analyzing) return;
  if (!STATE.settings.voyageKey) { toast('Voyage API 키를 설정해 주세요'); openSettings(); return; }

  STATE.analyzing = true;
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>분석 중';

  const stems = Object.keys(STATE.notes);
  if (!stems.length) { toast('업로드된 노트가 없습니다'); STATE.analyzing = false; btn.disabled = false; btn.innerHTML = '🔗 링크 추천'; return; }
  const toEmbed = stems.filter(s => !STATE.notes[s].embedding);

  showProgress(0, toEmbed.length + 1);

  try {
    for (let i = 0; i < toEmbed.length; i++) {
      const stem = toEmbed[i];
      updateProgress(i, toEmbed.length + 1, `임베딩 중: ${STATE.notes[stem].name}`);
      STATE.notes[stem].embedding = await getEmbeddingWithRetry(STATE.notes[stem].content);
      await new Promise(r => setTimeout(r, 3000));
    }

    updateProgress(toEmbed.length, toEmbed.length + 1, '현재 노트를 분석하고 있습니다');
    STATE.notes[STATE.currentStem].embedding = await getEmbeddingWithRetry(STATE.notes[STATE.currentStem].content);

    if (STATE.settings.githubToken) {
      updateProgress(toEmbed.length + 1, toEmbed.length + 1, 'GitHub에 저장 중...');
      await saveEmbeddingsToGitHub();
    }

    const curEmb = STATE.notes[STATE.currentStem].embedding;
    const sims = stems
      .filter(s => s !== STATE.currentStem && STATE.notes[s].embedding)
      .map(s => ({ stem: s, score: cosineSim(curEmb, STATE.notes[s].embedding) }))
      .filter(x => x.score >= 0.4)
      .sort((a, b) => b.score - a.score)
      .slice(0, 7);

    renderRecs(sims);
    renderNoteList();
  } catch(e) {
    toast('오류가 발생했습니다: ' + e.message);
    console.error(e);
  } finally {
    STATE.analyzing = false;
    btn.disabled = false;
    btn.innerHTML = '🔗 링크 추천';
    hideProgress();
  }
}

function showProgress(cur, total) {
  document.getElementById('progressWrap').style.display = 'block';
  updateProgress(cur, total, '');
}
function hideProgress() { document.getElementById('progressWrap').style.display = 'none'; }
function updateProgress(cur, total, label) {
  document.getElementById('progressLabel').textContent = label;
  if (cur >= 0 && total > 0) {
    document.getElementById('progressFill').style.width = `${cur/total*100}%`;
  }
}

// ── 추천 렌더 ─────────────────────────────────────────────────
function renderRecs(sims) {
  const list = document.getElementById('recList');
  if (!sims.length) {
    list.innerHTML = `<div style="color:var(--text-dimmer);padding:20px 0;text-align:center;line-height:2">관련 노트를 찾지 못했습니다<br><span style="font-size:11px">노트가 더 많아지면 개선됩니다</span></div>`;
    document.getElementById('copyAllWrap').style.display = 'none';
    return;
  }

  list.innerHTML = sims.map(({ stem, score }) => {
    const note = STATE.notes[stem];
    const displayName = note.name.replace(/\.md$/, '');
    const escapedStem = stem.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `
      <div class="rec-item">
        <div class="rec-name">[[${displayName}]]</div>
        ${note.folder ? `<div class="rec-folder">📁 ${note.folder}</div>` : ''}
        <div class="rec-score">유사도 ${(score * 100).toFixed(0)}%</div>
        <div class="score-bar"><div class="score-fill" style="width:${score*100}%"></div></div>
        <span class="copy-link" onclick="copyLink(this, '${escapedStem}')">복사</span>
      </div>`;
  }).join('');

  document.getElementById('copyAllWrap').style.display = 'block';
}

function copyLink(el, stem) {
  const note = STATE.notes[stem];
  const displayName = note ? note.name.replace(/\.md$/, '') : stem;
  navigator.clipboard.writeText(`[[${displayName}]]`);
  el.textContent = '복사됨 ✓';
  el.classList.add('copied');
  setTimeout(() => { el.textContent = '복사'; el.classList.remove('copied'); }, 1500);
}

function copyAll() {
  const items = document.querySelectorAll('.rec-name');
  const text = [...items].map(el => el.textContent).join('\n');
  navigator.clipboard.writeText(text);
  toast('전체가 복사되었습니다');
}

// ── 토스트 ────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

init();
</script>

</html>
